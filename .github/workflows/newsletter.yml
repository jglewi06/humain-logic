name: Weekly newsletter (The Sunday Brief)
on:
  schedule: [{ cron: '0 12 * * 0' }]  # Sundays 12:00 UTC (8 AM ET in summer, 7 AM ET in winter)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}       # unset => builds file only, nothing sent
      NEWSLETTER_AUTOSEND: ${{ vars.NEWSLETTER_AUTOSEND }}        # unset => Buttondown draft only
      NEWSLETTER_POSTAL_ADDRESS: ${{ vars.NEWSLETTER_POSTAL_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build-newsletter
      # Commit only the story pins (newsletter/*.picks.json): no postal address in them. The .md/.html issue
      # contains the address, so it is never committed (Buttondown holds the draft).
      - if: always()
        run: |
          git config user.name "humain-bot"; git config user.email "bot@users.noreply.github.com"
          git add newsletter/*.picks.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: pin Sunday Brief stories" && git push)
