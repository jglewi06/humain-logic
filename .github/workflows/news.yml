name: Fetch AI news
on:
  schedule: [{ cron: '17 */6 * * *' }]  # every 6h (off the hour to avoid Actions load spikes)
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: news, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run fetch-news
      - run: npm run build   # don't commit data that breaks the site
      - name: Commit if changed (push triggers Cloudflare Pages rebuild)
        run: |
          git config user.name "humain-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/news.json
          git diff --cached --quiet || (git commit -m "chore: update news" && git push)
