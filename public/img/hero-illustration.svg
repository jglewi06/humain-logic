<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 654" width="1440" height="654" aria-hidden="true" focusable="false">
  <!-- HumAIn Logic hero illustration. Decorative. Palette: Teal #1F6F6B, Teal-deep #17575A, Sage #DDEDE4,
       Apricot #F4B26B, Apricot tint #FDEBD6, Lavender #E9E7F6, Paper #FAF7F2, Ink #1F2A37.
       Layout: left scene x 0-280, right scene x 1150-1440, centre kept empty for the hero copy.
       Mobile crop (see homepage-mockup.html): bottom-right, about x 930-1440 / y 300-654. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17575A" flood-opacity=".18"/>
    </filter>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7E0D3"/><stop offset="1" stop-color="#C7E0D3" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <!-- ===== Left scene ===== -->
  <g id="left">
    <circle cx="150" cy="210" r="120" fill="#E9E7F6"/>
    <path d="M0 548 C110 528 250 560 430 654 L0 654 Z" fill="url(#ground)"/>

    <!-- helper card: a friendly suggestion -->
    <g transform="rotate(-6 145 200)" filter="url(#soft)">
      <rect x="58" y="148" width="176" height="108" rx="18" fill="#FFFFFF"/>
      <circle cx="88" cy="178" r="13" fill="#F4B26B"/>
      <rect x="110" y="170" width="92" height="9" rx="4.5" fill="#1F2A37" opacity=".55"/>
      <rect x="110" y="185" width="60" height="7" rx="3.5" fill="#56616F" opacity=".4"/>
      <rect x="76" y="206" width="140" height="8" rx="4" fill="#DDEDE4"/>
      <rect x="76" y="220" width="104" height="8" rx="4" fill="#DDEDE4"/>
      <rect x="160" y="232" width="56" height="14" rx="7" fill="#1F6F6B"/>
    </g>

    <!-- small checklist card -->
    <g transform="rotate(5 205 335)" filter="url(#soft)">
      <rect x="148" y="298" width="118" height="78" rx="16" fill="#FAF7F2"/>
      <circle cx="170" cy="320" r="8" fill="#1F6F6B"/>
      <path d="M166 320 l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="184" y="316" width="64" height="8" rx="4" fill="#1F6F6B" opacity=".35"/>
      <circle cx="170" cy="347" r="8" fill="#1F6F6B"/>
      <path d="M166 347 l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="184" y="343" width="48" height="8" rx="4" fill="#1F6F6B" opacity=".35"/>
    </g>

    <!-- big potted plant -->
    <g>
      <path d="M120 560 C110 500 80 470 44 452" fill="none" stroke="#17575A" stroke-width="6" stroke-linecap="round"/>
      <path d="M124 560 C128 490 150 450 190 420" fill="none" stroke="#17575A" stroke-width="6" stroke-linecap="round"/>
      <path d="M122 560 C120 500 118 450 116 396" fill="none" stroke="#17575A" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="40" cy="446" rx="44" ry="20" transform="rotate(28 40 446)" fill="#1F6F6B"/>
      <ellipse cx="196" cy="414" rx="46" ry="21" transform="rotate(-34 196 414)" fill="#3F8C84"/>
      <ellipse cx="114" cy="384" rx="22" ry="44" fill="#1F6F6B"/>
      <ellipse cx="72" cy="510" rx="34" ry="15" transform="rotate(20 72 510)" fill="#3F8C84"/>
      <ellipse cx="172" cy="492" rx="36" ry="15" transform="rotate(-22 172 492)" fill="#1F6F6B"/>
      <path d="M72 556 H174 a8 8 0 0 1 8 9 L172 640 a16 16 0 0 1 -16 14 H90 a16 16 0 0 1 -16 -14 L64 565 a8 8 0 0 1 8 -9 Z" fill="#F4B26B"/>
      <rect x="62" y="552" width="122" height="18" rx="9" fill="#E79A4C"/>
    </g>
  </g>

  <!-- ===== Right scene ===== -->
  <g id="right">
    <!-- sky: a cloud and the sun -->
    <g fill="#FFFFFF">
      <circle cx="1238" cy="176" r="26"/><circle cx="1270" cy="164" r="34"/><circle cx="1306" cy="180" r="24"/>
      <rect x="1214" y="176" width="114" height="28" rx="14"/>
    </g>
    <circle cx="1384" cy="326" r="52" fill="#FDEBD6"/>
    <circle cx="1384" cy="326" r="34" fill="#F4B26B"/>

    <!-- ground -->
    <path d="M880 654 C1040 600 1210 586 1440 578 L1440 654 Z" fill="url(#ground)"/>

    <!-- floor plant -->
    <g>
      <ellipse cx="1112" cy="560" rx="14" ry="30" transform="rotate(-24 1112 560)" fill="#3F8C84"/>
      <ellipse cx="1150" cy="552" rx="14" ry="32" transform="rotate(20 1150 552)" fill="#1F6F6B"/>
      <ellipse cx="1130" cy="540" rx="12" ry="34" fill="#1F6F6B"/>
      <path d="M1104 594 H1158 L1150 646 a10 10 0 0 1 -10 8 H1122 a10 10 0 0 1 -10 -8 Z" fill="#F4B26B"/>
    </g>

    <!-- chair back -->
    <rect x="1250" y="470" width="100" height="96" rx="30" fill="#F4B26B"/>

    <!-- person: relaxed, in charge -->
    <g>
      <path d="M1250 566 C1250 512 1268 490 1300 490 C1332 490 1350 512 1350 566 Z" fill="#1F6F6B"/>
      <rect x="1291" y="470" width="18" height="24" rx="8" fill="#B5764F"/>
      <circle cx="1300" cy="452" r="25" fill="#B5764F"/>
      <path d="M1274 452 C1272 428 1286 418 1302 418 C1320 418 1330 432 1326 448 C1316 436 1298 432 1282 446 Z" fill="#1F2A37"/>
      <circle cx="1322" cy="424" r="11" fill="#1F2A37"/>
      <path d="M1288 462 q12 9 24 0" fill="none" stroke="#1F2A37" stroke-width="2.6" stroke-linecap="round"/>
      <!-- relaxed arm resting, hand by the laptop -->
      <path d="M1258 520 C1246 540 1250 556 1268 556" fill="none" stroke="#1F6F6B" stroke-width="16" stroke-linecap="round"/>
      <path d="M1342 520 C1356 540 1352 556 1334 556" fill="none" stroke="#1F6F6B" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- desk, laptop, mug, little plant -->
    <rect x="1168" y="556" width="268" height="14" rx="7" fill="#17575A"/>
    <rect x="1188" y="570" width="10" height="70" rx="5" fill="#17575A"/>
    <rect x="1404" y="570" width="10" height="70" rx="5" fill="#17575A"/>
    <rect x="1260" y="502" width="80" height="54" rx="9" fill="#FAF7F2"/>
    <circle cx="1300" cy="529" r="6" fill="#F4B26B"/>
    <rect x="1250" y="552" width="100" height="6" rx="3" fill="#E6E0D6"/>
    <rect x="1366" y="530" width="24" height="26" rx="6" fill="#F4B26B"/>
    <path d="M1390 536 h4 a7 7 0 0 1 0 14 h-4" fill="none" stroke="#F4B26B" stroke-width="4"/>
    <ellipse cx="1196" cy="522" rx="7" ry="16" transform="rotate(-20 1196 522)" fill="#3F8C84"/>
    <ellipse cx="1210" cy="520" rx="7" ry="17" transform="rotate(18 1210 520)" fill="#1F6F6B"/>
    <rect x="1190" y="534" width="26" height="22" rx="6" fill="#FDEBD6"/>

    <!-- floating helper cards -->
    <g transform="rotate(-5 1218 390)" filter="url(#soft)">
      <rect x="1166" y="352" width="104" height="78" rx="16" fill="#FFFFFF"/>
      <circle cx="1186" cy="373" r="7.5" fill="#1F6F6B"/>
      <path d="M1182.5 373 l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1200" y="369" width="54" height="8" rx="4" fill="#1F6F6B" opacity=".35"/>
      <circle cx="1186" cy="397" r="7.5" fill="#1F6F6B"/>
      <path d="M1182.5 397 l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1200" y="393" width="44" height="8" rx="4" fill="#1F6F6B" opacity=".35"/>
      <circle cx="1186" cy="418" r="7.5" fill="none" stroke="#1F6F6B" stroke-width="2.4"/>
      <rect x="1200" y="414" width="50" height="8" rx="4" fill="#DDEDE4"/>
    </g>
    <g transform="rotate(4 1380 414)" filter="url(#soft)">
      <rect x="1338" y="394" width="86" height="44" rx="14" fill="#E9E7F6"/>
      <path d="M1352 438 l-4 12 14 -12 Z" fill="#E9E7F6"/>
      <rect x="1352" y="406" width="58" height="7" rx="3.5" fill="#1F2A37" opacity=".45"/>
      <rect x="1352" y="420" width="38" height="7" rx="3.5" fill="#1F2A37" opacity=".3"/>
    </g>
  </g>
</svg>
